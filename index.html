<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fortnite V-Bucks & Account Management Dashboard">
    <title>FN Manager Pro | Live Cloud Edition</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    
    <!-- Babel Standalone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js" crossorigin="anonymous"></script>

    <!-- Firebase Import Map for Native Cloud Support -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
      }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { fn: { dark: '#0f172a', card: '#1e293b', primary: '#3b82f6', accent: '#8b5cf6' } }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-y: scroll; }
        .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "firebase/firestore";

        const { useState, useEffect, useMemo, useRef, useCallback } = window.React;

        // ============================================================================
        // 🌐 LIVE CLOUD DATABASE CONFIGURATION
        // ============================================================================
        // If hosting on VERCEL or external domains, paste your Firebase Config here:
        const VERCEL_FIREBASE_CONFIG = null; /* Example: { apiKey: "...", projectId: "..." } */
        // ============================================================================

        const hasNativeCloud = typeof __firebase_config !== 'undefined' && __firebase_config;
        const configToUse = VERCEL_FIREBASE_CONFIG || (hasNativeCloud ? JSON.parse(__firebase_config) : null);
        
        let app, auth, db, globalAppId;
        if (configToUse) {
            app = initializeApp(configToUse);
            auth = getAuth(app);
            db = getFirestore(app);
            // FIXED: Use the correct Sandbox App ID for the Firestore path to bypass permission errors
            globalAppId = typeof __app_id !== 'undefined' ? __app_id : (configToUse.projectId || 'fn-manager');
        }

        // --- Utility Functions ---
        const parseNum = (val) => {
            if (!val) return 0;
            const str = String(val).replace(/[^0-9.-]+/g, "");
            return Number(str) || 0;
        };

        const robustCSVParse = (str) => {
            const arr = []; let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr.map(row => row.map(cell => cell.trim()));
        };

        // --- Core Application Component ---
        function App() {
            const [user, setUser] = useState(null);
            const [data, setData] = useState([]);
            
            // UI States
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('All');
            const [currentPage, setCurrentPage] = useState(1);
            const [modalConfig, setModalConfig] = useState({ isOpen: false, item: null, parentId: null });
            const [dataManagerOpen, setDataManagerOpen] = useState(false);
            const [toast, setToast] = useState(null);
            const [isConnecting, setIsConnecting] = useState(true);

            const itemsPerPage = 20;

            const showToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            // 1. Authenticate to Cloud
            useEffect(() => {
                if (!configToUse) {
                    setIsConnecting(false);
                    showToast("No Cloud Config Found. Offline mode.", "warning");
                    return;
                }
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && !VERCEL_FIREBASE_CONFIG) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth Error:", error);
                        showToast("Authentication Failed", "warning");
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) setIsConnecting(false);
                });
                return () => unsubscribe();
            }, []);

            // 2. Real-time Cloud Sync Listener (Shared Public Database)
            useEffect(() => {
                if (!user || !db) return;
                
                // Using a 'public' collection so everyone views the same data instantly
                const recordsRef = collection(db, 'artifacts', globalAppId, 'public', 'data', 'records');
                
                const unsubscribe = onSnapshot(recordsRef, (snapshot) => {
                    const fetchedData = [];
                    snapshot.forEach(doc => fetchedData.push(doc.data()));
                    
                    // Sort descending by ID to keep newest on top
                    fetchedData.sort((a, b) => b.id.localeCompare(a.id));
                    
                    setData(fetchedData);
                    setIsConnecting(false);
                }, (error) => {
                    console.error("Sync Error:", error);
                    showToast("Real-time sync interrupted.", "warning");
                });

                return () => unsubscribe();
            }, [user]);

            // --- Database Write Handlers ---
            const handleSave = async (formData) => {
                if (!user) return showToast("Not connected to cloud.", "warning");
                
                const recordId = modalConfig.item ? String(modalConfig.item.id) : Date.now().toString() + Math.random().toString(36).substr(2, 5);
                const newItem = { ...formData, id: recordId };
                if (modalConfig.parentId) newItem.parentId = String(modalConfig.parentId);
                
                try {
                    const docRef = doc(db, 'artifacts', globalAppId, 'public', 'data', 'records', recordId);
                    await setDoc(docRef, newItem);
                    showToast(modalConfig.item ? 'Record updated!' : (modalConfig.parentId ? 'Sub-order added!' : 'Main account added!'));
                } catch(e) { showToast("Failed to save to cloud.", "warning"); }
                
                setModalConfig({ isOpen: false, item: null, parentId: null });
            };

            const handleDelete = async (id) => {
                if (!user) return;
                if(confirm("PERMANENT DELETE: Are you sure you want to delete this record and all attached sub-orders for EVERYONE?")) {
                    try {
                        // Delete parent
                        await deleteDoc(doc(db, 'artifacts', globalAppId, 'public', 'data', 'records', String(id)));
                        
                        // Delete children
                        const children = data.filter(d => String(d.parentId) === String(id));
                        for (const child of children) {
                            await deleteDoc(doc(db, 'artifacts', globalAppId, 'public', 'data', 'records', String(child.id)));
                        }
                        showToast('Record deleted.', 'warning');
                    } catch(e) { showToast("Failed to delete from cloud.", "warning"); }
                }
            };

            const toggleArchive = async (id) => {
                if (!user) return;
                const item = data.find(d => String(d.id) === String(id));
                const isArchiving = !item?.isArchived;
                const itemsToUpdate = data.filter(d => String(d.id) === String(id) || String(d.parentId) === String(id));
                
                try {
                    for (const d of itemsToUpdate) {
                        const docRef = doc(db, 'artifacts', globalAppId, 'public', 'data', 'records', String(d.id));
                        await setDoc(docRef, { ...d, isArchived: isArchiving });
                    }
                    showToast(isArchiving ? 'Archived Completed Order' : 'Restored to Dashboard');
                } catch(e) { showToast("Failed to update cloud.", "warning"); }
            };

            // --- Computed Data & Filtering ---
            const enrichedData = useMemo(() => {
                return data.map(item => {
                    if (item.parentId) return item;
                    const children = data.filter(d => String(d.parentId) === String(item.id));
                    const totalUsed = parseNum(item.orderVb) + children.reduce((sum, child) => sum + parseNum(child.orderVb), 0);
                    const remain = parseNum(item.availableVb) - totalUsed;
                    return { ...item, _computedRemain: remain, _computedUsed: totalUsed };
                });
            }, [data]);

            const metrics = useMemo(() => {
                const mainAccounts = data.filter(d => !d.parentId);
                const totalAvailable = mainAccounts.reduce((sum, d) => sum + parseNum(d.availableVb), 0);
                const totalOrdered = data.reduce((sum, d) => sum + parseNum(d.orderVb), 0);
                const activeData = data.filter(d => !d.isArchived);
                
                return {
                    accounts: mainAccounts.length,
                    stock: activeData.filter(d => d.status === 'Stock').length,
                    pending: activeData.filter(d => d.status === 'Pending').length,
                    done: activeData.filter(d => d.status === 'Done').length,
                    totalAvailable,
                    totalOrdered,
                    remain: totalAvailable - totalOrdered
                };
            }, [data]);

            const displayGroups = useMemo(() => {
                const term = searchTerm.toLowerCase();
                const mains = enrichedData.filter(d => !d.parentId);
                const groups = [];

                mains.forEach(main => {
                    const isMainArchived = !!main.isArchived;
                    if (filterStatus === 'Archived' && !isMainArchived) return;
                    if (filterStatus !== 'Archived' && isMainArchived) return;

                    const children = enrichedData.filter(d => String(d.parentId) === String(main.id));
                    const matchesSearch = 
                        main.accountId?.toLowerCase().includes(term) || main.ign?.toLowerCase().includes(term) ||
                        children.some(c => c.ign?.toLowerCase().includes(term) || c.item?.toLowerCase().includes(term));
                    
                    if (term && !matchesSearch) return;

                    const filteredMain = (filterStatus === 'All' || filterStatus === 'Archived' || main.status === filterStatus) ? main : null;
                    const filteredChildren = children.filter(c => filterStatus === 'All' || filterStatus === 'Archived' || c.status === filterStatus);

                    if (filteredMain || filteredChildren.length > 0) {
                        groups.push({ main, children: filteredChildren });
                    }
                });
                return groups;
            }, [enrichedData, searchTerm, filterStatus]);

            const totalPages = Math.max(1, Math.ceil(displayGroups.length / itemsPerPage));
            const paginatedGroups = displayGroups.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            useEffect(() => { if (currentPage > totalPages) setCurrentPage(1); }, [filterStatus, searchTerm, totalPages]);

            return (
                <div className="min-h-screen p-4 md:p-6 lg:p-8 flex flex-col gap-6">
                    {/* Top Header Navigation */}
                    <header className="flex flex-col md:flex-row justify-between items-center gap-4 animate-fade-in">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                                <i className="fa-solid fa-bolt text-2xl text-white"></i>
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-3">
                                    FN Manager Pro
                                    {isConnecting ? (
                                        <div className="flex items-center gap-1.5 px-2.5 py-0.5 bg-slate-800/80 rounded-full border border-slate-700">
                                            <div className="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                                            <span className="text-[10px] font-bold text-slate-300 tracking-wider uppercase hidden sm:inline-block">Connecting...</span>
                                        </div>
                                    ) : user ? (
                                        <div className="flex items-center gap-1.5 px-2.5 py-0.5 bg-emerald-900/40 rounded-full border border-emerald-500/50 shadow-inner">
                                            <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                            <span className="text-[10px] font-bold text-emerald-300 tracking-wider uppercase hidden sm:inline-block">Live Global Sync</span>
                                        </div>
                                    ) : (
                                        <div className="flex items-center gap-1.5 px-2.5 py-0.5 bg-red-900/40 rounded-full border border-red-500/50 shadow-inner">
                                            <div className="w-2 h-2 rounded-full bg-red-500"></div>
                                            <span className="text-[10px] font-bold text-red-300 tracking-wider uppercase hidden sm:inline-block">Offline</span>
                                        </div>
                                    )}
                                </h1>
                                <p className="text-sm text-slate-400 font-medium">Instantly Shared Collaborative Edition</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            <button onClick={() => setDataManagerOpen(true)} className={`px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold transition-all shadow-sm border border-slate-700 text-slate-200 flex items-center gap-2`}>
                                <i className="fa-solid fa-database text-purple-400"></i> Cloud Data Hub
                            </button>
                            <button onClick={() => setModalConfig({ isOpen: true, item: null, parentId: null })} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-bold transition-all shadow-lg shadow-blue-600/30 flex items-center gap-2">
                                <i className="fa-solid fa-plus"></i> New Account
                            </button>
                        </div>
                    </header>

                    {/* Dashboard Metrics */}
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 animate-fade-in" style={{animationDelay: '0.1s'}}>
                        <MetricCard title="Total DB Accounts" value={metrics.accounts} icon="fa-gamepad" color="text-purple-400" />
                        <MetricCard title="Active In Stock" value={metrics.stock} icon="fa-box" color="text-blue-400" />
                        <MetricCard title="Active Pending" value={metrics.pending} icon="fa-clock" color="text-yellow-400" />
                        <MetricCard title="Active Done" value={metrics.done} icon="fa-check-circle" color="text-green-400" />
                        <MetricCard title="All-Time V-Bucks" value={metrics.totalAvailable.toLocaleString()} icon="fa-coins" color="text-cyan-400" />
                        <MetricCard title="All-Time Remain" value={metrics.remain.toLocaleString()} icon="fa-wallet" color={metrics.remain < 0 ? 'text-red-400' : 'text-emerald-400'} />
                    </div>

                    {/* Main Interface */}
                    <div className="glass-panel rounded-2xl flex flex-col flex-grow shadow-2xl overflow-hidden animate-fade-in" style={{animationDelay: '0.2s'}}>
                        
                        {/* Toolbar / Filters */}
                        <div className="p-4 border-b border-slate-700/50 flex flex-col lg:flex-row gap-4 bg-slate-800/40 items-center justify-between">
                            <div className="relative w-full lg:max-w-md">
                                <i className="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" placeholder="Search ID, IGN, or Skin..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full bg-slate-900/80 border border-slate-700 text-sm rounded-lg py-2.5 pl-10 pr-4 focus:ring-2 focus:ring-blue-500 outline-none text-slate-200 transition-all" />
                            </div>
                            <div className="flex flex-wrap gap-2 bg-slate-900/50 p-1.5 rounded-lg border border-slate-800">
                                {['All', 'Stock', 'Pending', 'Done', 'Archived'].map(status => (
                                    <button key={status} onClick={() => { setFilterStatus(status); setCurrentPage(1); }}
                                        className={`px-4 py-1.5 rounded-md text-sm font-semibold transition-all ${filterStatus === status ? 'bg-blue-600 text-white shadow-sm' : status === 'Archived' ? 'text-purple-400 hover:bg-slate-800' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                        {status === 'Archived' && <i className="fa-solid fa-box-archive mr-1.5"></i>}
                                        {status}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Data Table */}
                        <div className="overflow-x-auto flex-grow min-h-[400px]">
                            <table className="w-full text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr className="bg-slate-900/80 text-slate-400 text-xs uppercase tracking-wider font-semibold border-b border-slate-700">
                                        <th className="p-4 w-1/6">Fortnite ID</th>
                                        <th className="p-4 text-right">Available</th>
                                        <th className="p-4 text-right">Ordered</th>
                                        <th className="p-4 text-right">Remain</th>
                                        <th className="p-4">Buyer IGN</th>
                                        <th className="p-4">Skin / Bundle</th>
                                        <th className="p-4">Date</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4">Contact</th>
                                        <th className="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="text-sm">
                                    {isConnecting ? (
                                        <tr><td colSpan="10" className="p-16 text-center text-slate-500 font-medium">
                                            <i className="fa-solid fa-cloud-arrow-down text-5xl mb-4 text-blue-400 animate-bounce block"></i> Syncing to Live Database...
                                        </td></tr>
                                    ) : paginatedGroups.length === 0 ? (
                                        <tr><td colSpan="10" className="p-16 text-center text-slate-500 font-medium">
                                            <i className="fa-solid fa-folder-open text-5xl mb-4 opacity-30 block"></i> No records found. Try adjusting filters or adding data.
                                        </td></tr>
                                    ) : paginatedGroups.map((group) => (
                                        <React.Fragment key={group.main.id}>
                                            {/* Main Account Row */}
                                            {group.main && (
                                                <tr className={`border-b border-slate-700/30 hover:bg-slate-800/60 transition-colors group ${group.main.isArchived ? 'opacity-60 bg-slate-900/50' : 'bg-slate-800/20'}`}>
                                                    <td className="p-4">
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-bold text-white tracking-wide">{group.main.accountId}</span>
                                                            <button onClick={() => { navigator.clipboard.writeText(group.main.accountId); showToast("ID Copied!"); }} className="text-slate-500 hover:text-blue-400 transition-colors"><i className="fa-regular fa-copy"></i></button>
                                                        </div>
                                                    </td>
                                                    <td className="p-4 text-right font-bold text-slate-300 text-lg">{group.main.availableVb ? parseNum(group.main.availableVb).toLocaleString() : '-'}</td>
                                                    <td className="p-4 text-right">
                                                        {group.main.orderVb ? <span className="text-orange-400 font-bold text-lg drop-shadow-sm">{parseNum(group.main.orderVb).toLocaleString()}</span> : '-'}
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        <div className="flex flex-col items-end gap-1">
                                                            <span className={`font-bold text-lg drop-shadow-sm ${group.main._computedRemain < 0 ? 'text-red-400' : 'text-cyan-400'}`}>
                                                                {group.main._computedRemain?.toLocaleString()}
                                                            </span>
                                                            {parseNum(group.main.availableVb) > 0 && (
                                                                <div className="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden flex shadow-inner">
                                                                    <div className={`h-full ${group.main._computedRemain < 0 ? 'bg-red-500' : 'bg-cyan-400'}`} style={{width: `${Math.min(100, Math.max(0, (group.main._computedRemain / parseNum(group.main.availableVb)) * 100))}%`}}></div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-4 font-medium text-slate-200">{group.main.ign || '-'}</td>
                                                    <td className="p-4 text-slate-300 truncate max-w-[150px]">{group.main.item || '-'}</td>
                                                    <td className="p-4 text-slate-400 text-xs">{group.main.date || '-'}</td>
                                                    <td className="p-4"><StatusBadge status={group.main.status} isArchived={group.main.isArchived} /></td>
                                                    <td className="p-4 text-blue-400 font-medium">{group.main.tgId || '-'}</td>
                                                    <td className="p-4 text-right">
                                                        <div className="flex justify-end gap-1 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity">
                                                            <button onClick={() => toggleArchive(group.main.id)} className={`p-2 rounded-lg transition-colors ${group.main.isArchived ? 'text-green-400 hover:bg-green-400/20' : 'text-slate-400 hover:text-purple-400 hover:bg-purple-400/20'}`} title={group.main.isArchived ? "Restore Order" : "Archive Order"}>
                                                                <i className={`fa-solid ${group.main.isArchived ? 'fa-box-open' : 'fa-box-archive'}`}></i>
                                                            </button>
                                                            {!group.main.isArchived && <button onClick={() => setModalConfig({ isOpen: true, item: null, parentId: group.main.id })} className="p-2 text-slate-400 hover:text-blue-400 hover:bg-blue-400/20 rounded-lg"><i className="fa-solid fa-code-branch"></i></button>}
                                                            <button onClick={() => setModalConfig({ isOpen: true, item: group.main, parentId: null })} className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg"><i className="fa-solid fa-pen"></i></button>
                                                            <button onClick={() => handleDelete(group.main.id)} className="p-2 text-slate-400 hover:text-red-400 hover:bg-red-400/20 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}

                                            {/* Sub-order Rows */}
                                            {group.children.map(child => (
                                                <tr key={child.id} className={`border-b border-slate-700/20 hover:bg-slate-800/60 transition-colors group ${child.isArchived ? 'opacity-50 bg-slate-900/80' : 'bg-slate-900/30'}`}>
                                                    <td className="p-4 pl-8 text-slate-500 border-l-2 border-blue-500/20"><i className="fa-solid fa-level-up-alt fa-rotate-90 mr-2 text-xs"></i> <span className="text-[10px] tracking-wider uppercase">Sub</span></td>
                                                    <td className="p-4"></td>
                                                    <td className="p-4 text-right"><span className="text-orange-400/90 font-semibold text-base">{child.orderVb ? parseNum(child.orderVb).toLocaleString() : '-'}</span></td>
                                                    <td className="p-4"></td>
                                                    <td className="p-4 font-medium text-slate-200">{child.ign || '-'}</td>
                                                    <td className="p-4 text-slate-300 truncate max-w-[150px]">{child.item || '-'}</td>
                                                    <td className="p-4 text-slate-400 text-xs">{child.date || '-'}</td>
                                                    <td className="p-4"><StatusBadge status={child.status} isArchived={child.isArchived} /></td>
                                                    <td className="p-4 text-blue-400 font-medium">{child.tgId || '-'}</td>
                                                    <td className="p-4 text-right">
                                                        <div className="flex justify-end gap-1 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity">
                                                            <button onClick={() => setModalConfig({ isOpen: true, item: child, parentId: child.parentId })} className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg"><i className="fa-solid fa-pen"></i></button>
                                                            <button onClick={() => handleDelete(child.id)} className="p-2 text-slate-400 hover:text-red-400 hover:bg-red-400/20 rounded-lg"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* Pagination Footer */}
                        {totalPages > 1 && (
                            <div className="p-4 border-t border-slate-700/50 bg-slate-800/40 flex justify-between items-center">
                                <span className="text-sm text-slate-400 font-medium">Showing Page <span className="text-white">{currentPage}</span> of {totalPages}</span>
                                <div className="flex gap-2">
                                    <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="px-4 py-1.5 bg-slate-700 disabled:opacity-50 hover:bg-slate-600 rounded text-sm font-bold transition-colors"><i className="fa-solid fa-chevron-left"></i> Prev</button>
                                    <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="px-4 py-1.5 bg-slate-700 disabled:opacity-50 hover:bg-slate-600 rounded text-sm font-bold transition-colors">Next <i className="fa-solid fa-chevron-right"></i></button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Form Modal */}
                    {modalConfig.isOpen && (
                        <FormModal item={modalConfig.item} isSubOrder={!!modalConfig.parentId} onClose={() => setModalConfig({ isOpen: false, item: null, parentId: null })} onSave={handleSave} />
                    )}

                    {/* Data Manager Modal */}
                    {dataManagerOpen && (
                        <DataManager 
                            user={user} 
                            db={db}
                            data={data} 
                            onClose={() => setDataManagerOpen(false)} 
                            showToast={showToast} 
                        />
                    )}

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-2xl font-bold border flex items-center gap-3 animate-fade-in z-50 ${toast.type === 'warning' ? 'bg-red-900/90 border-red-500 text-red-100' : 'bg-emerald-900/90 border-emerald-500 text-emerald-100'}`}>
                            <i className={`fa-solid ${toast.type === 'warning' ? 'fa-triangle-exclamation' : 'fa-check-circle'}`}></i>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        }

        // --- Sub Components ---

        function MetricCard({ title, value, icon, color }) {
            return (
                <div className="bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl flex flex-col justify-between hover:bg-slate-800 transition-colors group">
                    <div className="flex justify-between items-start mb-1">
                        <span className="text-slate-400 text-[10px] sm:text-[11px] font-bold uppercase tracking-widest">{title}</span>
                        <i className={`fa-solid ${icon} ${color} opacity-70 text-lg group-hover:scale-110 transition-transform`}></i>
                    </div>
                    <div className={`text-xl sm:text-2xl font-black tracking-tight ${color}`}>{value}</div>
                </div>
            );
        }

        function StatusBadge({ status, isArchived }) {
            if (isArchived) return <span className="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider bg-purple-500/10 text-purple-400 border border-purple-500/20"><i className="fa-solid fa-box-archive"></i> Archived</span>;
            const config = {
                'Done': { c: 'text-green-400 bg-green-400/10 border-green-500/20', i: 'fa-check' },
                'Pending': { c: 'text-yellow-400 bg-yellow-400/10 border-yellow-500/20', i: 'fa-clock' },
                'Stock': { c: 'text-blue-400 bg-blue-400/10 border-blue-500/20', i: 'fa-box' }
            }[status] || { c: 'text-slate-400 bg-slate-800 border-slate-600', i: 'fa-circle' };
            
            return <span className={`px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider border inline-flex items-center gap-1.5 ${config.c}`}><i className={`fa-solid ${config.i}`}></i> {status}</span>;
        }

        function FormModal({ item, isSubOrder, onClose, onSave }) {
            const [formData, setFormData] = useState(item || { accountId: '', availableVb: '', ign: '', orderVb: '', date: '', item: '', status: 'Stock', tgId: '' });

            return (
                <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden animate-fade-in">
                        <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/40">
                            <h2 className="text-xl font-bold text-white flex items-center gap-3">
                                {item ? 'Edit Record' : (isSubOrder ? 'New Sub-Order' : 'New Account')}
                                {isSubOrder && <span className="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded uppercase tracking-wider font-bold">Attached</span>}
                            </h2>
                            <button onClick={onClose} type="button" className="text-slate-400 hover:text-white p-1 transition-colors"><i className="fa-solid fa-times text-xl"></i></button>
                        </div>
                        <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }} className="p-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                {!isSubOrder && (
                                    <>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Fortnite ID</label>
                                            <input type="text" required value={formData.accountId} onChange={(e)=>setFormData({...formData, accountId: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-white focus:border-blue-500 outline-none transition-all" placeholder="e.g. FNNEW6k.1" />
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Available V-Bucks</label>
                                            <input type="text" required value={formData.availableVb} onChange={(e)=>setFormData({...formData, availableVb: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-white focus:border-blue-500 outline-none transition-all" placeholder="e.g. 6000" />
                                        </div>
                                        <div className="col-span-full border-t border-slate-800 my-1"></div>
                                    </>
                                )}
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Status</label>
                                    <select value={formData.status} onChange={(e)=>setFormData({...formData, status: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-white focus:border-blue-500 outline-none transition-all">
                                        <option value="Stock">📦 In Stock (Unused)</option>
                                        <option value="Pending">⏳ Pending (To Gift)</option>
                                        <option value="Done">✅ Done (Gifted)</option>
                                    </select>
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Ordered V-Bucks</label>
                                    <input type="text" value={formData.orderVb} onChange={(e)=>setFormData({...formData, orderVb: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-orange-400 focus:border-blue-500 outline-none transition-all" placeholder="e.g. 3200" />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Buyer IGN</label>
                                    <input type="text" value={formData.ign} onChange={(e)=>setFormData({...formData, ign: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-white focus:border-blue-500 outline-none transition-all" />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Skin / Bundle</label>
                                    <input type="text" value={formData.item} onChange={(e)=>setFormData({...formData, item: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-white focus:border-blue-500 outline-none transition-all" />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Gift Date</label>
                                    <input type="date" value={formData.date} onChange={(e)=>setFormData({...formData, date: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-slate-300 focus:border-blue-500 outline-none transition-all" />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Telegram ID</label>
                                    <input type="text" value={formData.tgId} onChange={(e)=>setFormData({...formData, tgId: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-medium text-blue-400 focus:border-blue-500 outline-none transition-all" />
                                </div>
                            </div>
                            <div className="mt-8 flex justify-end gap-3 pt-4 border-t border-slate-800">
                                <button type="button" onClick={onClose} className="px-6 py-2.5 rounded-lg font-bold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">Cancel</button>
                                <button type="submit" className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-white shadow-lg transition-all flex items-center gap-2">
                                    <i className="fa-solid fa-cloud-arrow-up"></i> Save to Cloud
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function DataManager({ user, db, data, onClose, showToast }) {
            const csvInputRef = useRef(null);

            const exportCSV = () => {
                const rows = [["Fortnite ID", "Available V-Bucks", "Remain V-Bucks", "IGN", "Order V-Bucks", "Gift Send Date", "Skin / Bundle", "Status", "TG ID"].join(',')];
                const mains = data.filter(d => !d.parentId);
                mains.forEach(main => {
                    const used = data.filter(d => String(d.parentId) === String(main.id)).reduce((s, c) => s + parseNum(c.orderVb), parseNum(main.orderVb));
                    const rem = parseNum(main.availableVb) - used;
                    rows.push([`"${main.accountId||''}"`, main.availableVb||'', rem, `"${main.ign||''}"`, main.orderVb||'', `"${main.date||''}"`, `"${main.item||''}"`, `"${main.status||''}"`, `"${main.tgId||''}"`].join(','));
                    data.filter(d => String(d.parentId) === String(main.id)).forEach(child => {
                        rows.push([`""`, `""`, `""`, `"${child.ign||''}"`, child.orderVb||'', `"${child.date||''}"`, `"${child.item||''}"`, `"${child.status||''}"`, `"${child.tgId||''}"`].join(','));
                    });
                });
                const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `FN_CSV_Export_${new Date().toISOString().split('T')[0]}.csv`; a.click();
            };

            const handleCSVImport = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!user) return showToast("Cannot import while offline.", "warning");
                if (!confirm("Importing CSV will append data to the cloud database. Continue?")) { e.target.value = null; return; }

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const rows = robustCSVParse(event.target.result);
                    let hIdx = rows.findIndex(r => r.some(c => c.toLowerCase().includes('fortnite id')));
                    if(hIdx === -1) { showToast("Invalid CSV format", "warning"); e.target.value = null; return; }

                    const h = rows[hIdx].map(c => c.toLowerCase());
                    const idx = { 
                        fnId: h.findIndex(c=>c.includes('fortnite id')), avail: h.findIndex(c=>c.includes('available')), 
                        ign: h.findIndex(c=>c==='ign'||c.includes('ign')), order: h.findIndex(c=>c.includes('order')), 
                        date: h.findIndex(c=>c.includes('date')), item: h.findIndex(c=>c.includes('skin')), 
                        status: h.findIndex(c=>c==='status'), tg: h.findIndex(c=>c.includes('tg')) 
                    };

                    const newData = []; let currentParentId = null;
                    for(let i = hIdx + 1; i < rows.length; i++) {
                        const c = rows[i]; if(c.length <= Math.max(...Object.values(idx).filter(v=>v!==-1))) continue;
                        const sGet = (ind) => (ind !== -1 && c[ind]) ? c[ind] : '';
                        
                        const acc = sGet(idx.fnId), ign = sGet(idx.ign), itm = sGet(idx.item), ord = sGet(idx.order), rawStat = sGet(idx.status).toLowerCase();
                        if(acc.toLowerCase().includes('total') || (!acc && !ign && !itm && !ord)) continue;

                        let stat = 'Stock';
                        if(rawStat.includes('done')) stat = 'Done'; else if(rawStat.includes('pending') || (!rawStat && ign)) stat = 'Pending';

                        const rec = { id: Date.now().toString()+'-'+i, orderVb: ord, ign, item: itm, date: sGet(idx.date), status: stat, tgId: sGet(idx.tg) };
                        if (acc) { rec.accountId = acc; rec.availableVb = sGet(idx.avail); currentParentId = rec.id; } 
                        else if (currentParentId) { rec.parentId = currentParentId; } else continue;
                        newData.push(rec);
                    }
                    
                    showToast("Uploading to Cloud...");
                    try {
                        const { setDoc, doc } = await import('firebase/firestore');
                        for (const rec of newData) {
                            const docRef = doc(db, 'artifacts', globalAppId, 'public', 'data', 'records', String(rec.id));
                            await setDoc(docRef, rec);
                        }
                        showToast(`Successfully uploaded ${newData.length} records to Cloud!`);
                    } catch (err) {
                        showToast("Cloud Upload Failed", "warning");
                    }
                    onClose();
                };
                reader.readAsText(file);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl shadow-2xl overflow-hidden animate-fade-in">
                        <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-800/40">
                            <h2 className="text-xl font-bold text-white"><i className="fa-solid fa-cloud text-blue-400 mr-2"></i> Cloud Data Hub</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors"><i className="fa-solid fa-times text-xl"></i></button>
                        </div>
                        <div className="p-6 space-y-6">
                            
                            <div className="bg-emerald-900/20 border border-emerald-500/30 p-4 rounded-xl">
                                <h3 className="text-emerald-400 font-bold mb-1"><i className="fa-solid fa-globe"></i> Database is Live</h3>
                                <p className="text-sm text-emerald-200/70">Because you are using the Live Cloud Edition, your data automatically saves and syncs to everyone instantly. No manual backups are required.</p>
                            </div>

                            <div>
                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Excel / Spreadsheet</h3>
                                <div className="flex gap-3">
                                    <button onClick={exportCSV} className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-white transition-all"><i className="fa-solid fa-file-csv text-blue-400 mr-2"></i> Export to CSV</button>
                                    <input type="file" accept=".csv" className="hidden" ref={csvInputRef} onChange={handleCSVImport} />
                                    <button onClick={() => csvInputRef.current.click()} className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-semibold text-slate-300 transition-all"><i className="fa-solid fa-cloud-arrow-up mr-2"></i> Import to Cloud</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
