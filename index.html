                                        placeholder="e.g. Lambo Bundle" />
                                </div>

                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Gift Date</label>
                                    <input type="date" name="date" value={form.date || ''} onChange={handleChange}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-300 outline-none transition-all focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
                                </div>

                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Telegram ID</label>
                                    <input type="text" name="tgId" value={form.tgId || ''} onChange={handleChange}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm font-mono text-blue-400 placeholder-slate-600 outline-none transition-all focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                                        placeholder="@username" />
                                </div>

                                {item && (
                                    <div className="col-span-full pt-2">
                                        <label className="flex items-center gap-2 cursor-pointer group">
                                            <input type="checkbox" name="isArchived" checked={!!form.isArchived} onChange={handleChange}
                                                className="w-4 h-4 rounded border-slate-600 bg-slate-800 text-purple-500 focus:ring-purple-500/30" />
                                            <span className="text-sm text-slate-300 group-hover:text-white transition-colors">Archived (hidden from main view)</span>
                                        </label>
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-end gap-2 pt-4 border-t border-slate-800">
                                <button type="button" onClick={onClose}
                                    className="px-5 py-2.5 rounded-lg font-bold text-slate-400 hover:text-white hover:bg-slate-800 transition-all text-sm">
                                    Cancel
                                </button>
                                <button type="submit" disabled={saving}
                                    className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:hover:bg-blue-600 rounded-lg font-bold text-white shadow-lg shadow-blue-600/20 transition-all text-sm flex items-center gap-2">
                                    {saving ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-cloud-arrow-up"></i>}
                                    {saving ? 'Saving...' : item ? 'Update' : 'Save to Cloud'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function HelpModal({ onClose }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={(e) => e.target === e.currentTarget && onClose()}>
                    <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="glass-modal border border-slate-700/80 rounded-2xl w-full max-w-lg shadow-2xl relative animate-slide-up">
                        <div className="p-5 border-b border-slate-800 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white"><i className="fa-solid fa-circle-question text-blue-400 mr-2"></i>Help & Shortcuts</h2>
                            <button onClick={onClose} className="text-slate-500 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div className="p-5 space-y-4 text-sm text-slate-300">
                            <div>
                                <h3 className="text-white font-bold mb-1 text-xs uppercase tracking-wider">Keyboard Shortcuts</h3>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <span className="text-slate-400">Ctrl + K</span><span>Focus search</span>
                                    <span className="text-slate-400">Ctrl + N</span><span>New account</span>
                                    <span className="text-slate-400">Escape</span><span>Close modal</span>
                                </div>
                            </div>
                            <div>
                                <h3 className="text-white font-bold mb-1 text-xs uppercase tracking-wider">Data Sync</h3>
                                <p className="text-xs text-slate-400">Your data syncs in real-time across all devices. Anyone you share this page with can see live updates. Data is also backed up locally for offline access.</p>
                            </div>
                            <div>
                                <h3 className="text-white font-bold mb-1 text-xs uppercase tracking-wider">Import / Export</h3>
                                <p className="text-xs text-slate-400">Use CSV for spreadsheet compatibility. Use JSON backup for complete data preservation including all metadata.</p>
                            </div>
                            <div className="pt-2 border-t border-slate-800">
                                <p className="text-[10px] text-slate-500">FN Manager Pro v{CONFIG.version} · Built for GitHub Pages</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        //  RENDER
        // ============================================================
        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
