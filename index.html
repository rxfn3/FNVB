<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fortnite V-Bucks & Account Management Dashboard">
    <title>FN Manager Pro | Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { --scrollbar-thumb: #334155; --scrollbar-track: #0b1120; }
        * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0b1120; color: #f1f5f9; min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const ReactDOM = window.ReactDOM;

        // Your Firebase config
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDP1XqcC6DEnAi-A-ggI2oeQOuDM0HxXpQ",
            authDomain: "fortnite-manager-pro.firebaseapp.com",
            projectId: "fortnite-manager-pro",
            storageBucket: "fortnite-manager-pro.firebasestorage.app",
            messagingSenderId: "239599063665",
            appId: "1:239599063665:web:906ba62330061c84a381d0"
        };

        const APP_ID = 'fn-manager-pro';      // matches your Firestore rules path
        const IS_CLOUD = true;                // always use cloud when config is present

        // ---------- Utilities ----------
        const pn = (v) => { if (!v) return 0; const n = Number(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
        const fmt = (v) => pn(v).toLocaleString('en-US');
        const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2,6);
        const qcsv = (s) => s ? (s.includes(',')||s.includes('"') ? `"${s.replace(/"/g,'""')}"` : s) : '';
        const parsecsv = (l) => { let r=[],c='',q=false; for(let ch of l){ if(ch=='"')q=!q; else if(ch==','&&!q){r.push(c);c='';} else c+=ch; } r.push(c); return r.map(s=>s.trim().replace(/^"|"$/g,'')); };

        // ---------- Local backup ----------
        const LSKEY = 'fn_db_backup';
        const loadLocal = () => { try { const d=JSON.parse(localStorage.getItem(LSKEY)); return d?.data||[]; } catch{ return []; } };
        const saveLocal = (data) => { try { localStorage.setItem(LSKEY, JSON.stringify({data,ts:Date.now()})); } catch{} };

        // ---------- Firebase ----------
        let app, auth, db;
        try {
            app = firebase.initializeApp(FIREBASE_CONFIG);
            auth = firebase.auth();
            db = firebase.firestore();
            db.enablePersistence().catch(() => {});
        } catch(e) { console.warn(e); }

        const colRef = () => db.collection('artifacts').doc(APP_ID).collection('public').doc('records').collection('items');

        // ---------- Toast ----------
        let toastFn;
        const toast = (msg, type='success') => toastFn && toastFn({msg,type,id:Date.now()});

        // ---------- Components ----------
        function MetricCard({title, value, icon, color, sub}) {
            return (
                <div className="bg-slate-800/60 border border-slate-700/50 p-3 rounded-xl flex flex-col justify-between hover:bg-slate-700/60 transition-colors">
                    <div className="flex justify-between items-start mb-1">
                        <span className="text-slate-400 text-[10px] font-bold uppercase tracking-wider">{title}</span>
                        <i className={`fa-solid ${icon} ${color} opacity-60 text-sm`}></i>
                    </div>
                    <div className={`text-2xl font-black tracking-tight ${color} tabular-nums`}>{value}</div>
                    {sub && <div className="text-[10px] text-slate-500 mt-0.5">{sub}</div>}
                </div>
            );
        }

        function StatusBadge({ status }) {
            const m = {
                Done: {c:'text-emerald-400 bg-emerald-400/10 border-emerald-500/20', i:'fa-check-circle', l:'Done'},
                Pending: {c:'text-amber-400 bg-amber-400/10 border-amber-500/20', i:'fa-clock', l:'Pending'},
                Stock: {c:'text-sky-400 bg-sky-400/10 border-sky-500/20', i:'fa-box', l:'In Stock'}
            }[status] || {c:'text-slate-400 bg-slate-800', i:'fa-circle', l:status};
            return <span className={`px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider border inline-flex items-center gap-1 ${m.c}`}><i className={`fa-solid ${m.i} text-[10px]`}></i>{m.l}</span>;
        }

        function Modal({ children, onClose }) {
            return <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={onClose}><div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 animate-fade-in" onClick={e=>e.stopPropagation()}>{children}</div></div>;
        }

        function FormModal({ item, isSub, parent, onClose, onSave }) {
            const [f, setF] = useState(item||{accountId:'',availableVb:'',ign:'',orderVb:'',date:new Date().toISOString().split('T')[0],item:'',status:'Stock',tgId:''});
            const handleChange = (e) => setF({...f,[e.target.name]:e.target.value});
            const submit = (e) => { e.preventDefault(); onSave(f); };
            return (
                <Modal onClose={onClose}>
                    <h2 className="text-xl font-bold text-white mb-4">{item?'Edit':'New'} {isSub?'Sub-Order':'Account'}</h2>
                    <form onSubmit={submit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {!isSub && <>
                            <div><label className="text-xs text-slate-400 uppercase">Fortnite ID *</label><input name="accountId" required value={f.accountId} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" placeholder="FN..."/></div>
                            <div><label className="text-xs text-slate-400 uppercase">Available V-Bucks *</label><input name="availableVb" required value={f.availableVb} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" placeholder="6000"/></div>
                        </>}
                        <div><label className="text-xs text-slate-400 uppercase">Status</label><select name="status" value={f.status} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white"><option value="Stock">📦 In Stock</option><option value="Pending">⏳ Pending</option><option value="Done">✅ Done</option></select></div>
                        <div><label className="text-xs text-slate-400 uppercase">Ordered V-Bucks</label><input name="orderVb" value={f.orderVb} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-orange-400"/></div>
                        <div><label className="text-xs text-slate-400 uppercase">Buyer IGN</label><input name="ign" value={f.ign} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white"/></div>
                        <div><label className="text-xs text-slate-400 uppercase">Skin/Bundle</label><input name="item" value={f.item} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white"/></div>
                        <div><label className="text-xs text-slate-400 uppercase">Date</label><input type="date" name="date" value={f.date} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-300"/></div>
                        <div><label className="text-xs text-slate-400 uppercase">TG/Contact</label><input name="tgId" value={f.tgId} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-blue-400"/></div>
                        <div className="md:col-span-2 flex justify-end gap-3 mt-4">
                            <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 rounded text-slate-300">Cancel</button>
                            <button type="submit" className="px-4 py-2 bg-blue-600 rounded text-white font-bold">Save</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        function App() {
            const [data, setData] = useState(loadLocal());
            const [search, setSearch] = useState('');
            const [filter, setFilter] = useState('All');
            const [modal, setModal] = useState(null);
            const [toasts, setToasts] = useState([]);
            const [sync, setSync] = useState('offline');
            const [delConfirm, setDelConfirm] = useState(null);
            const fileRef = useRef(null);

            useEffect(() => { toastFn = (t) => { setToasts(p=>[...p,t]); setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==t.id)),3000); }; }, []);

            // Real-time sync
            useEffect(() => {
                if (!IS_CLOUD || !db) { setSync('offline'); return; }
                setSync('syncing');
                const unsub = colRef().onSnapshot(snap => {
                    const recs = [];
                    snap.forEach(doc => recs.push({...doc.data(), _docId: doc.id}));
                    recs.sort((a,b) => (a.parentId?1:-1) - (b.parentId?1:-1) || (a.accountId||'').localeCompare(b.accountId||''));
                    setData(recs);
                    saveLocal(recs);
                    setSync('synced');
                }, err => { console.error(err); setSync('error'); setData(loadLocal()); });
                return () => unsub();
            }, []);

            const enriched = useMemo(() => data.map(d => {
                if (d.parentId) return d;
                const kids = data.filter(x => x.parentId === d.id);
                const used = pn(d.orderVb) + kids.reduce((s,x)=>s+pn(x.orderVb),0);
                return {...d, _remain: pn(d.availableVb)-used, _kids: kids.length};
            }), [data]);

            const metrics = useMemo(() => {
                const active = data.filter(d=>!d.isArchived);
                const mains = active.filter(d=>!d.parentId);
                const avail = mains.reduce((s,d)=>s+pn(d.availableVb),0);
                const ordered = active.reduce((s,d)=>s+pn(d.orderVb),0);
                return {
                    accounts: mains.length,
                    stock: active.filter(d=>d.status==='Stock' && !d.parentId).length,
                    pending: active.filter(d=>d.status==='Pending').length,
                    done: active.filter(d=>d.status==='Done').length,
                    avail, ordered, remain: avail-ordered
                };
            }, [data]);

            const groups = useMemo(() => {
                const term = search.toLowerCase();
                const mains = enriched.filter(d=>!d.parentId);
                return mains.flatMap(m => {
                    const arch = m.isArchived;
                    if (filter==='Archived' && !arch) return [];
                    if (filter!=='Archived' && arch) return [];
                    const kids = data.filter(d=>d.parentId===m.id);
                    const show = !term || [m.accountId,m.ign,m.item,m.tgId,...kids.map(k=>[k.ign,k.item,k.tgId]).flat()].some(v=>String(v).toLowerCase().includes(term));
                    if (term && !show) return [];
                    const mainOk = filter==='All'||filter==='Archived'||m.status===filter;
                    const fkids = kids.filter(k=>filter==='All'||filter==='Archived'||k.status===filter);
                    return [{main: mainOk?m:null, kids: fkids}];
                });
            }, [enriched, search, filter]);

            const saveRecord = async (rec) => {
                const id = rec.id || uid();
                const doc = {...rec, id, updatedAt: Date.now()};
                if (modal?.parentId) doc.parentId = modal.parentId;
                if (db) await colRef().doc(id).set(doc);
                toast('Saved!');
                setModal(null);
            };

            const deleteRecord = async (id) => {
                const kids = data.filter(d=>d.parentId===id).map(d=>d.id);
                const all = [id, ...kids];
                if (db) {
                    const batch = db.batch();
                    all.forEach(rid => batch.delete(colRef().doc(rid)));
                    await batch.commit();
                }
                setData(prev => prev.filter(d => !all.includes(d.id)));
                toast('Deleted');
                setDelConfirm(null);
            };

            const toggleArchive = async (id) => {
                const it = data.find(d=>d.id===id);
                if (!it) return;
                const val = !it.isArchived;
                const related = data.filter(d=>d.id===id || d.parentId===id).map(d=>d.id);
                if (db) {
                    const batch = db.batch();
                    related.forEach(rid => batch.update(colRef().doc(rid), {isArchived: val, updatedAt: Date.now()}));
                    await batch.commit();
                }
                setData(prev => prev.map(d => related.includes(d.id) ? {...d, isArchived: val} : d));
            };

            const exportCSV = () => {
                const head = ['Fortnite ID','Available V-Bucks','Remain','IGN','Ordered','Date','Skin/Bundle','Status','TG ID'];
                const rows = [head.join(',')];
                enriched.filter(d=>!d.parentId).forEach(m => {
                    rows.push([qcsv(m.accountId),m.availableVb||'',m._remain,qcsv(m.ign),m.orderVb||'',qcsv(m.date),qcsv(m.item),m.status,qcsv(m.tgId)].join(','));
                    data.filter(d=>d.parentId===m.id).forEach(k => rows.push(['','','',qcsv(k.ign),k.orderVb||'',qcsv(k.date),qcsv(k.item),k.status,qcsv(k.tgId)].join(',')));
                });
                const blob = new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv'});
                const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`fn_export_${new Date().toISOString().slice(0,10)}.csv`; a.click();
            };

            const exportJSON = () => {
                const blob = new Blob([JSON.stringify({data, exported: new Date().toISOString()},null,2)],{type:'application/json'});
                const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`fn_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
            };

            const importJSON = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const txt = await file.text();
                try {
                    const {data: imported} = JSON.parse(txt);
                    if (!Array.isArray(imported)) throw new Error();
                    if (db) {
                        const batch = db.batch();
                        imported.forEach(r => batch.set(colRef().doc(r.id), r));
                        await batch.commit();
                    }
                    toast(`Imported ${imported.length} records`);
                } catch { toast('Invalid file','warning'); }
                e.target.value = null;
            };

            const importCSV = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const txt = await file.text();
                const lines = txt.split(/\r?\n/).filter(l=>l.trim());
                // Simple CSV parsing
                const rows = lines.map(parsecsv);
                // Find header
                const hIdx = rows.findIndex(r => r.some(c=>c.toLowerCase().includes('fortnite id')));
                if (hIdx<0) { toast('CSV missing header','warning'); e.target.value=null; return; }
                const h = rows[hIdx].map(c=>c.trim().toLowerCase());
                const idx = {
                    fn: h.findIndex(c=>c.includes('fortnite id')),
                    av: h.findIndex(c=>c.includes('available v-bucks')),
                    ig: h.findIndex(c=>c.includes('ign')),
                    or: h.findIndex(c=>c.includes('order v-bucks')),
                    dt: h.findIndex(c=>c.includes('date')),
                    it: h.findIndex(c=>c.includes('skin')||c.includes('bundle')),
                    st: h.findIndex(c=>c==='status'),
                    tg: h.findIndex(c=>c.includes('tg')||c.includes('telegram'))
                };
                const newRecs = [];
                let parentId = null;
                for (let i=hIdx+1; i<rows.length; i++) {
                    const c = rows[i];
                    const get = (idx) => idx>=0 && idx<c.length ? c[idx].trim() : '';
                    const fn = get(idx.fn);
                    if (!fn && !get(idx.ig)) continue;
                    const rec = {
                        id: uid(),
                        orderVb: get(idx.or),
                        ign: get(idx.ig),
                        item: get(idx.it),
                        date: get(idx.dt),
                        status: (get(idx.st).toLowerCase().includes('done')?'Done':(get(idx.st).toLowerCase().includes('pending')?'Pending':'Stock')),
                        tgId: get(idx.tg),
                        updatedAt: Date.now()
                    };
                    if (fn) {
                        rec.accountId = fn;
                        rec.availableVb = get(idx.av);
                        parentId = rec.id;
                    } else {
                        rec.parentId = parentId;
                    }
                    newRecs.push(rec);
                }
                if (db) {
                    const batch = db.batch();
                    newRecs.forEach(r => batch.set(colRef().doc(r.id), r));
                    await batch.commit();
                }
                toast(`Imported ${newRecs.length} records`);
                e.target.value = null;
            };

            return (
                <div className="min-h-screen p-4 md:p-6 flex flex-col gap-4 max-w-[1400px] mx-auto">
                    <header className="flex flex-wrap justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center"><i className="fa-solid fa-bolt text-white text-xl"></i></div>
                            <div>
                                <h1 className="text-xl font-bold text-white flex items-center gap-2">FN Manager Pro <span className={`text-xs px-2 py-0.5 rounded-full border border-slate-700 ${sync==='synced'?'text-emerald-400 border-emerald-500':'text-slate-400'}`}>{sync==='synced'?'Live':'Offline'}</span></h1>
                                <p className="text-xs text-slate-400">Cloud dashboard</p>
                            </div>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            <button onClick={()=>fileRef.current.click()} className="px-3 py-2 bg-slate-800 rounded text-sm"><i className="fa-solid fa-upload"></i> CSV</button>
                            <input type="file" accept=".csv" ref={fileRef} onChange={importCSV} className="hidden"/>
                            <button onClick={exportCSV} className="px-3 py-2 bg-slate-800 rounded text-sm"><i className="fa-solid fa-download"></i> CSV</button>
                            <button onClick={exportJSON} className="px-3 py-2 bg-slate-800 rounded text-sm"><i className="fa-solid fa-floppy-disk"></i> Backup</button>
                            <label className="px-3 py-2 bg-slate-800 rounded text-sm cursor-pointer"><i className="fa-solid fa-folder-open"></i> Restore<input type="file" accept=".json" onChange={importJSON} className="hidden"/></label>
                            <button onClick={()=>setModal({})} className="px-3 py-2 bg-blue-600 rounded text-sm font-bold"><i className="fa-solid fa-plus"></i> New</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                        <MetricCard title="Accounts" value={metrics.accounts} icon="fa-gamepad" color="text-purple-400"/>
                        <MetricCard title="In Stock" value={metrics.stock} icon="fa-box" color="text-sky-400"/>
                        <MetricCard title="Pending" value={metrics.pending} icon="fa-clock" color="text-amber-400"/>
                        <MetricCard title="Done" value={metrics.done} icon="fa-check-circle" color="text-emerald-400"/>
                        <MetricCard title="Total V-Bucks" value={fmt(metrics.avail)} icon="fa-coins" color="text-cyan-400"/>
                        <MetricCard title="Remaining" value={fmt(metrics.remain)} icon="fa-wallet" color={metrics.remain<0?'text-red-400':'text-emerald-400'}/>
                    </div>

                    <div className="bg-slate-900/80 border border-slate-700/50 rounded-xl overflow-hidden">
                        <div className="p-3 border-b border-slate-700 flex gap-3 items-center flex-wrap">
                            <div className="relative flex-1 max-w-md">
                                <i className="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                                <input placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded py-2 pl-9 pr-3 text-sm text-white"/>
                            </div>
                            <div className="flex gap-1 bg-slate-800 rounded p-0.5">
                                {['All','Stock','Pending','Done','Archived'].map(s=>(
                                    <button key={s} onClick={()=>setFilter(s)} className={`px-3 py-1 rounded text-xs font-semibold ${filter===s?'bg-blue-600 text-white':'text-slate-400 hover:text-white'}`}>{s}</button>
                                ))}
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-slate-800/50 text-slate-400 text-xs uppercase">
                                    <tr>
                                        <th className="p-3 text-left">Fortnite ID</th><th className="p-3 text-right">Available</th><th className="p-3 text-right">Ordered</th><th className="p-3 text-right">Remain</th>
                                        <th className="p-3">IGN</th><th className="p-3">Skin</th><th className="p-3">Date</th><th className="p-3">Status</th><th className="p-3">Contact</th><th className="p-3"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {groups.map((g,i) => (
                                        <React.Fragment key={i}>
                                            {g.main && (
                                                <tr className="border-b border-slate-700/40 hover:bg-slate-800/50">
                                                    <td className="p-3 font-bold text-white">{g.main.accountId}</td>
                                                    <td className="p-3 text-right">{fmt(g.main.availableVb)}</td>
                                                    <td className="p-3 text-right text-orange-400">{fmt(g.main.orderVb)}</td>
                                                    <td className="p-3 text-right font-bold text-cyan-400">{fmt(g.main._remain)}</td>
                                                    <td className="p-3">{g.main.ign||'-'}</td>
                                                    <td className="p-3 text-slate-300">{g.main.item||'-'}</td>
                                                    <td className="p-3 text-slate-400">{g.main.date||'-'}</td>
                                                    <td className="p-3"><StatusBadge status={g.main.status}/></td>
                                                    <td className="p-3 text-blue-400">{g.main.tgId||'-'}</td>
                                                    <td className="p-3">
                                                        <div className="flex gap-1">
                                                            <button onClick={()=>toggleArchive(g.main.id)} className="p-1 text-slate-400 hover:text-purple-400"><i className="fa-solid fa-box-archive"></i></button>
                                                            <button onClick={()=>setModal({parentId:g.main.id, parent:g.main})} className="p-1 text-slate-400 hover:text-blue-400"><i className="fa-solid fa-code-branch"></i></button>
                                                            <button onClick={()=>setModal({item:g.main})} className="p-1 text-slate-400 hover:text-white"><i className="fa-solid fa-pen"></i></button>
                                                            <button onClick={()=>{if(confirm('Delete?'))deleteRecord(g.main.id)}} className="p-1 text-slate-400 hover:text-red-400"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                            {g.kids.map(k => (
                                                <tr key={k.id} className="border-b border-slate-700/20 bg-slate-800/20 hover:bg-slate-700/50">
                                                    <td className="p-3 pl-6 text-slate-500"><i className="fa-solid fa-turn-up fa-rotate-90 text-xs mr-1"></i>SUB</td>
                                                    <td className="p-3"></td>
                                                    <td className="p-3 text-right text-orange-400/80">{fmt(k.orderVb)}</td>
                                                    <td className="p-3"></td>
                                                    <td className="p-3">{k.ign||'-'}</td>
                                                    <td className="p-3 text-slate-300">{k.item||'-'}</td>
                                                    <td className="p-3 text-slate-400">{k.date||'-'}</td>
                                                    <td className="p-3"><StatusBadge status={k.status}/></td>
                                                    <td className="p-3 text-blue-400">{k.tgId||'-'}</td>
                                                    <td className="p-3">
                                                        <div className="flex gap-1">
                                                            <button onClick={()=>setModal({item:k, parentId:k.parentId})} className="p-1 text-slate-400 hover:text-white"><i className="fa-solid fa-pen"></i></button>
                                                            <button onClick={()=>{if(confirm('Delete?'))deleteRecord(k.id)}} className="p-1 text-slate-400 hover:text-red-400"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {modal && <FormModal {...modal} onClose={()=>setModal(null)} onSave={saveRecord}/>}

                    <div className="fixed bottom-4 right-4 flex flex-col gap-2">
                        {toasts.map(t => (
                            <div key={t.id} className={`px-4 py-2 rounded-lg shadow-xl text-sm font-bold animate-slide-up ${t.type==='warning'?'bg-red-900 text-red-200':'bg-emerald-900 text-emerald-200'}`}>
                                {t.msg}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
